{{define "content"}}
<h1>Custom API connection</h1>
<p>Define the connector, test the credential without storing it, then create it with least-privilege scope. Credentials are never displayed back, logged, or stored outside the connector gateway.</p>
<form method="post" action="/connectors/custom/test">
<input type="hidden" name="opkey" value="{{.OpKey}}">
<label>Name <input name="name" type="text" required></label>
<label>Base API URL <input name="base_url" type="url" required></label>
<label>Test URL <input name="test_url" type="url"></label>
<label>Auth method <select name="auth_method"><option value="header">header</option><option value="custom_header">custom_header</option><option value="query_param">query_param</option><option value="url_path">url_path</option></select></label>
<label>Credential <input name="credential" type="password" autocomplete="off" required></label>
<button type="submit" formaction="/connectors/custom/test">Test without storing</button>
<button type="submit" formaction="/connectors/custom/create">Test passed — create scoped connection</button>
</form>
<p><a href="/connectors">Back to Connectors</a></p>
{{end}}
