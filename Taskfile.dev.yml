# Development database contract: repeatable, declarative entry points
# for bind, setup, diagnose, bootstrap, migrate, test, reset, and
# fingerprint. Every task delegates to `studio dev` verbs (Go, tested);
# this file carries only ordering, file requirements, and documentation.
#
# File handoff (no chat, no clipboards, no transcription): `task dev:bind`
# writes the branch binding (repo-local, gitignored, identities only)
# and the DSN (outside the repo, mode-0600, agent-unreadable). Tasks
# consume both by path; credentials never appear in task output.
version: "3"

vars:
  STUDIO: go run ./cmd/studio
  # Overridable per run, e.g. task dev:setup DSN_FILE=/elsewhere/dev.dsn
  METADATA_FILE: ./dev-neon.json
  DSN_FILE: $HOME/.config/miniapp-studio/dev.dsn
  NEON_PROJECT: miniapp-studio-dev
  NEON_BRANCH: dev
  # Local UI serving (all overridable per run). Secrets are never defaulted:
  # serve-init generates random values into these 0600 files on first run.
  SERVE_LISTEN: 127.0.0.1:8080
  SERVE_OPERATORS_FILE: $HOME/.config/miniapp-studio/operators.json
  SERVE_KEYS_FILE: $HOME/.config/miniapp-studio/miniapp-keys.json
  SERVE_GRANTS_FILE: $HOME/.config/miniapp-studio/miniapp-grants.json
  SERVE_APP_PASSWORD_FILE: $HOME/.config/miniapp-studio/app-role.pw
  SERVE_TOKEN_FILE: $HOME/.config/miniapp-studio/dev-login-token.txt
  SERVE_MARKER_FILE: ./dev-serve.json
  # Broker KEK (all overridable per run). TENANT/PROVIDER/REFRESH_FILE
  # have no defaults: broker verbs refuse to guess them.
  KEK_FILE: $HOME/.config/miniapp-studio/broker-kek
  TENANT: ''
  PROVIDER: ''
  REFRESH_FILE: ''

tasks:
  bind:
    desc: Bind the Neon branch by name (writes binding + DSN files; zero transcription; DSN never overwritten)
    cmds:
      - "{{.STUDIO}} dev bind --project {{.NEON_PROJECT}} --branch {{.NEON_BRANCH}} --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  secrets-validate:
    desc: Validate a dotenv file against the secrets registry (names only; ENV_FILE overridable; extras via --)
    cmds:
      - '{{.STUDIO}} dev secrets-validate --env-file {{.ENV_FILE | default "./dev.env"}} {{.CLI_ARGS}}'

  secrets-plan:
    desc: Show the sync plan (key names in scope) for an environment from a dotenv file; local only, no Fly calls (ENV_FILE=./dev.env ENV=dev overridable)
    cmds:
      - "{{.STUDIO}} dev secrets-plan --env-file {{.ENV_FILE | default \"./dev.env\"}} --env {{.ENV | default \"dev\"}}"

  broker-init-kek:
    desc: Generate the broker KEK file (0600, refuses overwrite; KEK_FILE overridable)
    cmds:
      - "{{.STUDIO}} dev broker-init-kek --kek-file {{.KEK_FILE}}"

  broker-enroll:
    desc: Enroll a tenant/provider refresh token (sealed at rest; REFRESH_FILE must be 0600; TENANT/PROVIDER/REFRESH_FILE/KEK_FILE overridable)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
      - sh: test -n "{{.TENANT}}"
        msg: "Pass TENANT=<id> (no default)"
      - sh: test -n "{{.PROVIDER}}"
        msg: "Pass PROVIDER=<id> (no default)"
      - sh: test -f "{{.REFRESH_FILE}}"
        msg: "Pass REFRESH_FILE=<0600 path holding the refresh token>"
    cmds:
      - "{{.STUDIO}} dev broker-enroll --kek-file {{.KEK_FILE}} --tenant {{.TENANT}} --provider {{.PROVIDER}} --refresh-file {{.REFRESH_FILE}} --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  broker-revoke:
    desc: Revoke a tenant/provider credential (future mints fail; TENANT/PROVIDER overridable)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
      - sh: test -n "{{.TENANT}}"
        msg: "Pass TENANT=<id> (no default)"
      - sh: test -n "{{.PROVIDER}}"
        msg: "Pass PROVIDER=<id> (no default)"
    cmds:
      - "{{.STUDIO}} dev broker-revoke --tenant {{.TENANT}} --provider {{.PROVIDER}} --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  broker-leases:
    desc: List lease metadata for a tenant (scope only; tokens are never stored or shown; TENANT overridable; filter via -- --provider P)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
      - sh: test -n "{{.TENANT}}"
        msg: "Pass TENANT=<id> (no default)"
    cmds:
      - "{{.STUDIO}} dev broker-leases --tenant {{.TENANT}} --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  setup:
    desc: Neon preflight for the dev branch (metadata, endpoint binding, TLS, live version; provisions nothing)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev setup --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  diag-roles:
    desc: Record studio_lookup capability booleans to ./dev-diag-roles.json (secret-free diagnostic)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev diag-roles --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} > ./dev-diag-roles.json"

  doctor:
    desc: Diagnose toolchain, endpoint, database, and migrations (fails loudly on any violated invariant)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev doctor --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  fingerprint:
    desc: Print the machine-readable environment record (JSON, no credentials)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev fingerprint --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}}"

  parity-capture:
    desc: Capture the fingerprint to ./dev-parity.local.json (gitignored) for cross-environment comparison
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev fingerprint --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} > ./dev-parity.local.json"

  init:
    desc: Ensure the shared dev database (idempotent; explicit --db-name provisions scratch instead)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev init --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  migrate:
    desc: Run pending Studio migrations on the bound branch (binding required so the production guard engages)
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} migrate --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  test:
    desc: "Run database-touching test packages serially (bind files required). Extra flags pass through: -- -v, -- -run NAME, -- -timeout 5m."
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev test --db-only --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  test-full:
    desc: Run the complete test suite serially through the bound branch
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev test --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  reset:
    desc: "Drop stale run databases. Preview: task dev:reset -- --dry-run. Execute: task dev:reset -- --yes"
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev reset --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} {{.CLI_ARGS}}"

  bootstrap:
    desc: "Full clean setup chain for a fresh environment: setup preflight, doctor, init, tests"
    cmds:
      - task: setup
      - task: doctor
      - task: init
      - task: test

  serve-init:
    desc: "One-time local UI setup: serve database, app role, operator, keys/grants (generates 0600 secret files on first run; never overwrites; rotates only with -- --rotate-app-password)"
    preconditions:
      - sh: test -f "{{.METADATA_FILE}}"
        msg: "Run task dev:bind first (missing {{.METADATA_FILE}})"
      - sh: test -f "{{.DSN_FILE}}"
        msg: "Run task dev:bind first (missing {{.DSN_FILE}})"
    cmds:
      - "{{.STUDIO}} dev serve-init --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} --operators-file {{.SERVE_OPERATORS_FILE}} --keys-file {{.SERVE_KEYS_FILE}} --grants-file {{.SERVE_GRANTS_FILE}} --app-password-file {{.SERVE_APP_PASSWORD_FILE}} --token-file {{.SERVE_TOKEN_FILE}} --marker-file {{.SERVE_MARKER_FILE}} {{.CLI_ARGS}}"

  serve:
    desc: "Serve the Studio UI locally (requires serve-init; loopback only; stop with Ctrl-C)"
    preconditions:
      - sh: test -f "{{.SERVE_MARKER_FILE}}"
        msg: "Run task dev:serve-init first (missing {{.SERVE_MARKER_FILE}})"
    cmds:
      - "{{.STUDIO}} dev serve --metadata-file {{.METADATA_FILE}} --dsn-file {{.DSN_FILE}} --operators-file {{.SERVE_OPERATORS_FILE}} --keys-file {{.SERVE_KEYS_FILE}} --grants-file {{.SERVE_GRANTS_FILE}} --app-password-file {{.SERVE_APP_PASSWORD_FILE}} --token-file {{.SERVE_TOKEN_FILE}} --marker-file {{.SERVE_MARKER_FILE}} --listen {{.SERVE_LISTEN}}"
